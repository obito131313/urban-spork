<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>📹 كاميرا المراقبة</title>
<style>
:root{
  --bg:#120d08;--card:#1c140c;--screen:#0a0705;--line:#3d2c1a;--line2:#2b1f13;
  --ac:#e8a33d;--ac2:#d9622b;--tx:#fbf3e4;--mut:#b5a48a;--ok:#5bbd7a;--bad:#ef5350;--rec:#ff3b30;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 60% at 50% 0,#2e1d10,var(--bg)) fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;padding:max(14px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}
.wrap{max-width:860px;margin:0 auto}
.narrow{max-width:460px;margin-inline:auto}
header{text-align:center;padding:14px 0 12px}
header .em{font-size:36px;line-height:1.2}
h1{margin:4px 0 2px;font-size:22px;color:var(--ac)}
header p{margin:0;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 30px #0006}
.center{text-align:center}
.lb{display:block;font-weight:700;margin-bottom:2px}
.h{color:var(--mut);font-size:13px;margin:0 0 8px}
input[type=text]{width:100%;background:#120b06;border:1.5px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;font-size:16px;padding:12px 14px;outline:none;transition:border-color .2s;text-align:right;font-family:var(--mono)}
input[type=text]:focus{border-color:var(--ac)}
input[type=text].bad,input[type=text].bad:focus{border-color:var(--bad)}
input[type=text].good,input[type=text].good:focus{border-color:var(--ok)}
.s{min-height:20px;font-size:13px;margin:6px 0 10px;color:var(--bad)}
button{font:inherit}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input:focus-visible{outline:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;color:#1b1106;background:linear-gradient(90deg,var(--ac),var(--ac2));cursor:pointer;text-align:center}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.alt{margin-top:12px;background:transparent;border:1.5px solid var(--line);color:var(--tx)}
.btn.sm{padding:10px;font-size:14px;margin-top:0}
.btn.stop{background:linear-gradient(90deg,#c62828,#e53935);color:#fff;border:0}
.codebox{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:1px;color:var(--ac);background:#120b06;border:1.5px dashed var(--ac);border-radius:12px;padding:14px 10px;margin:12px 0 10px;user-select:all;-webkit-user-select:all;word-break:break-all}
.glist{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;margin:4px 0 12px}
.gitem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;background:#16100a;border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;color:var(--tx);cursor:pointer;transition:border-color .15s}
.gitem:hover,.gitem:focus-visible{border-color:var(--ac)}
.gitem[disabled]{opacity:.6;cursor:not-allowed}
.gitem .gnm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem .gcnt{flex:none;color:var(--mut);font-size:12.5px;direction:ltr}
.err{color:var(--bad);font-size:14px;margin:10px 0 0;text-align:center;min-height:20px}
.big{font-size:48px;line-height:1.2;margin-bottom:4px}
h2{margin:0 0 6px;font-size:20px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:r .8s linear infinite;margin:8px auto}
@keyframes r{to{transform:rotate(360deg)}}

/* ---------- شاشة البث ---------- */
.live{background:var(--screen);border:1px solid #5a2118;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #000b}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:linear-gradient(180deg,#22150d,#170e08);border-bottom:1px solid #3a1c14}
.bar .l{display:flex;align-items:center;gap:10px;min-width:0}
.rec{display:inline-flex;align-items:center;gap:6px;background:var(--rec);color:#fff;font-weight:800;font-size:12px;padding:3px 9px;border-radius:6px;flex:none}
.rec i{width:8px;height:8px;border-radius:50%;background:#fff;animation:bl 1.3s steps(2,jump-none) infinite}
@keyframes bl{50%{opacity:.15}}
.gname{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs{font-size:12px;color:var(--mut);flex:none}
.stats{display:flex;gap:16px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line2);font-size:13px;color:var(--mut);background:#0f0a06}
.stats b{color:var(--tx);font-weight:700;font-family:var(--mono)}
.stats .tc{margin-inline-start:auto;direction:ltr;color:var(--rec)}
.screen{position:relative}
.screen:before,.screen:after{content:"";position:absolute;width:22px;height:22px;pointer-events:none;z-index:2;border:2px solid #ffffff55}
.screen:before{top:8px;right:8px;border-left:0;border-bottom:0}
.screen:after{bottom:8px;left:8px;border-right:0;border-top:0}
.feed{height:min(62vh,560px);min-height:340px;overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px)}
.empty{margin:auto;text-align:center;color:var(--mut);font-size:14px;line-height:1.9}
.empty .ic{font-size:34px;display:block}
.m{display:flex;gap:10px;align-items:flex-start}
.m.new .bd{animation:flash 1.1s ease-out}
@keyframes flash{from{background:#3a2a14}}
.av{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.bd{min-width:0;flex:0 1 auto;max-width:calc(100% - 44px);background:#16100a;border:1px solid var(--line2);border-radius:12px;padding:7px 11px}
.hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}
.nm{font-weight:800}
.nu{color:var(--mut);direction:ltr;unicode-bidi:isolate}
.tm{color:var(--mut);margin-inline-start:auto;direction:ltr;font-family:var(--mono);font-size:11.5px}
.tx{margin-top:2px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext}
.q{margin-top:4px;border-inline-start:3px solid var(--ac);padding:2px 8px;color:var(--mut);font-size:12.5px;background:#0e0905;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.m.k-m .tx{color:#d9c9ad}
.m.k-d .bd{border-color:#5a2118;background:#1d0f0c}
.m.k-d .tx{color:#ff8a80}
.m.bot .bd{border-color:#3b5a2c}
.jump{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;display:none;border:0;border-radius:20px;padding:7px 16px;background:var(--ac);color:#1b1106;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 16px #000a}
.ctl{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line2);background:#0f0a06}
.ctl .btn{flex:1;padding-inline:6px;white-space:nowrap}
.ctl .btn.stop{flex:1.5}
.live:fullscreen{display:flex;flex-direction:column;border-radius:0;border:0}
.live:fullscreen .screen{flex:1;min-height:0}
.live:fullscreen .feed{height:100%}
.live:-webkit-full-screen{display:flex;flex-direction:column;border-radius:0;border:0}
.live:-webkit-full-screen .screen{flex:1;min-height:0}
.live:-webkit-full-screen .feed{height:100%}
.stage{position:relative;height:min(62vh,560px);min-height:340px;overflow:hidden;background:radial-gradient(90% 70% at 50% 35%,#2a1a0e,#0a0705)}
.stage:before{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:repeating-linear-gradient(90deg,#ffffff0a 0 1px,transparent 1px 48px),repeating-linear-gradient(0deg,#ffffff0a 0 1px,transparent 1px 36px);transform:perspective(500px) rotateX(55deg);transform-origin:bottom}
.stage .empty{position:absolute;inset:0;display:grid;place-content:center;margin:0}
.grid{position:relative;z-index:1;height:100%;padding:14px 14px 58px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:center}
.tile{position:relative;width:clamp(96px,30%,170px);aspect-ratio:3/4;border-radius:16px;background:linear-gradient(#1d140c,#120b06);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;transition:border-color .25s,box-shadow .25s,transform .25s;animation:pop .4s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.tile.spk{border-color:var(--ok);box-shadow:0 0 0 3px #5bbd7a33,0 0 26px #5bbd7a55;transform:translateY(-4px)}
.pic{position:relative;width:62%;aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:34px;font-weight:800;color:#fff}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.nmb{position:absolute;bottom:0;inset-inline:0;padding:5px 8px;font-size:12px;font-weight:700;text-align:center;background:#000a;border-radius:0 0 14px 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{position:absolute;z-index:3;inset:6px 6px auto;max-height:62%;overflow:hidden;background:#fbf3e4;color:#1b1106;border-radius:12px;padding:6px 9px;font-size:13px;line-height:1.5;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext;opacity:0;transform:scale(.92);pointer-events:none;transition:opacity .2s,transform .2s}
.cap.on{opacity:1;transform:none}
.stt{position:absolute;top:8px;inset-inline-start:8px;display:none;font-size:11px;background:#000b;border-radius:10px;padding:2px 8px}
.typ .stt,.rec .stt{display:block}
.typ .stt:after{content:"✍️ يكتب…"}
.rec .stt:after{content:"🎙️ يسجّل…"}
.rec .stt{color:var(--rec)}
.typ .pic,.rec .pic{animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.07)}}
.chy{position:absolute;z-index:4;inset:auto 0 0 0;padding:10px 14px;background:linear-gradient(90deg,#d9622bee,#e8a33dee);color:#1b1106;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.chy:empty{display:none}
.chy.in{animation:sl .35s ease-out}
@keyframes sl{from{transform:translateY(100%)}}
.vig{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,#000a),repeating-linear-gradient(0deg,#0000 0 2px,#0000000d 2px 3px)}
.live:fullscreen .stage{height:100%}
.live:-webkit-full-screen .stage{height:100%}
@media (prefers-reduced-motion:reduce){.rec i,.m.new .bd,.spin,.tile,.chy.in,.typ .pic,.rec .pic{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="em">📹</div>
    <h1>كاميرا المراقبة</h1>
    <p>شاهد غرفة أي جروب فيه البوت مباشرة، بالأعضاء والصور والرسائل</p>
  </header>
  <main id="app"><div class="card center narrow"><div class="spin"></div></div></main>
  <footer>Obito Bot</footer>
</div>
<script>
(function () {
'use strict';
// ---------------------------------------------------------------
// الصفحة تكلّم البوت عبر وسيط ntfy: كل رسالة مشفّرة بمفتاح مشتق من توكن الرابط (الموجود في الرابط فقط).
// لو بدّلت الوسيط في البوت (RECEPTION_RELAY) أضف عنوانه هنا.
// ---------------------------------------------------------------
var RELAYS = ['https://ntfy.sh'];
var BASE_TITLE = document.title;
var CFG = null;

var app = document.getElementById('app');
var enc8 = new TextEncoder(), dec8 = new TextDecoder();

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function hex(u) { return Array.prototype.map.call(u, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
function b64(u) { var s = '', i; for (i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { var b = atob(s), u = new Uint8Array(b.length), i; for (i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function sha(s) { return new Uint8Array(await crypto.subtle.digest('SHA-256', enc8.encode(s))); }

function parseHash(h) {
  var o = {};
  String(h || '').replace(/^#/, '').split('&').forEach(function (p) {
    var i = p.indexOf('=');
    if (i > 0) { try { o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); } catch (e) {} }
  });
  return o;
}

async function initCfg(hash) {
  var p = parseHash(hash);
  if (!/^[a-f0-9]{32}$/.test(p.t || '') || !/^[A-Za-z0-9_-]{1,64}$/.test(p.r || '') || RELAYS.indexOf(p.s) < 0) return false;
  var tid = hex(await sha(p.t)).slice(0, 20);
  var key = await crypto.subtle.importKey('raw', await sha('obito-cam:' + p.t), 'AES-GCM', false, ['encrypt', 'decrypt']);
  CFG = { relay: p.s.replace(/\/+$/, ''), topic: p.r, feed: p.r + '-f-' + tid, tid: tid, key: key, tok: p.t, sk: null };
  return true;
}

async function encObj(obj, key) {
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc8.encode(JSON.stringify(obj))));
  var all = new Uint8Array(12 + ct.length);
  all.set(iv, 0); all.set(ct, 12);
  return b64(all);
}
async function decObj(s, key) {
  var u = unb64(s);
  var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12) }, key, u.subarray(12));
  return JSON.parse(dec8.decode(pt));
}
// فك التشفير: نجرّب مفتاح الجلسة أولاً (بعد التحقق) ثم مفتاح التوكن، ونعرف بأي مفتاح نجح
async function decAny(s) {
  if (CFG.sk) { try { return { o: await decObj(s, CFG.sk), s: true }; } catch (e) {} }
  try { return { o: await decObj(s, CFG.key), s: false }; } catch (e) { return null; }
}

async function post(obj) {
  var tries = 0;
  for (;;) {
    try {
      var r = await fetch(CFG.relay + '/' + CFG.topic, { method: 'POST', body: JSON.stringify(obj) });
      if (r.ok) return;
      if (r.status === 429 || r.status >= 500) throw new Error('retry ' + r.status);
      throw new Error('fatal ' + r.status);
    } catch (e) {
      tries++;
      if (tries >= 4 || /fatal/.test(String(e.message))) throw e;
      await sleep(1500 * tries);
    }
  }
}

// طلب للبوت بدون انتظار رد
// sess=true: يُشفَّر بمفتاح الجلسة (بعد التحقق فقط)، وإلا بمفتاح التوكن (مرحلة التحقق)
async function send(meta, sess) {
  if (sess && !CFG.sk) throw new Error('nosess');
  var d = await encObj(meta, sess ? CFG.sk : CFG.key);
  if (d.length > 3000) throw new Error('too big');
  var env = { v: 1, k: CFG.tid, d: d };
  if (sess) env.s = 1;
  await post(env);
}

// طلب للبوت مع انتظار الرد (يصل عبر قناة البث نفسها)
var pending = {};
function rpc(meta, timeout, sess) {
  var mid = (Math.random().toString(36) + '000000').slice(2, 12);
  meta.m = mid;
  return new Promise(function (resolve, reject) {
    var to = setTimeout(function () { delete pending[mid]; reject(new Error('timeout')); }, timeout || 25000);
    pending[mid] = { sess: !!sess, fn: function (o) { clearTimeout(to); delete pending[mid]; resolve(o); } };
    send(meta, sess).catch(function (e) { clearTimeout(to); delete pending[mid]; reject(e); });
  });
}

// ---------------------------------------------------------------
// قناة البث (SSE) من الوسيط
// ---------------------------------------------------------------
var es = null, retryT = null, wdT = null;
var lastTime = 0, lastBeat = 0, seen = {}, seenN = 0, chain = Promise.resolve();
var connected = false, ready = false, stopped = false;

function beat() { lastBeat = Date.now(); }

function setConn(ok) {
  connected = ok;
  var n = document.getElementById('cs');
  if (n) n.textContent = ok ? '🟢 متصل' : '🟠 إعادة الاتصال…';
}

function connect() {
  clearTimeout(retryT);
  if (es) { try { es.close(); } catch (e) {} es = null; }
  if (stopped) return;
  var url = CFG.relay + '/' + CFG.feed + '/sse' + (lastTime ? '?since=' + lastTime : '');
  var cur = new EventSource(url);
  es = cur;
  cur.onopen = function () {
    if (es !== cur) return;
    beat(); setConn(true);
    if (!ready) { ready = true; startAuth(); }
  };
  cur.onmessage = function (e) { if (es !== cur) return; beat(); onFeed(e.data); };
  cur.addEventListener('keepalive', function () { if (es === cur) beat(); });
  cur.onerror = function () {
    if (es !== cur) return;
    setConn(false);
    try { cur.close(); } catch (e) {}
    es = null;
    retryT = setTimeout(connect, 2500);
  };
}

function onFeed(data) {
  var ev;
  try { ev = JSON.parse(data); } catch (e) { return; }
  if (!ev || ev.event !== 'message' || typeof ev.message !== 'string' || !ev.id) return;
  if (seen[ev.id]) return;
  seen[ev.id] = 1;
  if (++seenN > 800) { seen = {}; seenN = 0; }
  if (ev.time) lastTime = ev.time;
  var m;
  try { m = JSON.parse(ev.message); } catch (e) { return; }
  if (!m || m.v !== 1 || m.k !== CFG.tid || typeof m.d !== 'string') return;
  // نحافظ على ترتيب الوصول (فك التشفير غير متزامن)
  chain = chain.then(function () { return decAny(m.d); }).then(function (r) { if (r) return onObj(r.o, r.s); }).catch(function () {});
}

// viaSess: الرسالة فُكّت بمفتاح الجلسة (أي من البوت بعد التحقق). البيانات الحساسة لا تُقبل إلا بهذا المفتاح.
function onObj(o, viaSess) {
  if (!o || typeof o !== 'object') return;
  if (o.t === 'ack') {
    var pd = o.m && pending[o.m];
    if (pd && (!pd.sess || viaSess)) pd.fn(o);
    return;
  }
  if (o.t === 'msgs') { if (viaSess && watching && Array.isArray(o.l)) addMsgs(o.l); return; }
  if (o.t === 'auth') return onAuth(o);
  if (o.t === 'err') {
    if (o.error === 'reauth') { if (AUTH.st !== 'wait') { startAuth(); } return; }
    if (o.error === 'invalid') { endLive(false); view(msgView('⌛', 'انتهت الجلسة', o.message || '')); return; }
    if (viaSess) { endLive(false); view(formView(o.message || '⚠️ توقفت المراقبة.')); }
  }
}

// ---------------------------------------------------------------
// واجهة
// ---------------------------------------------------------------
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function html(h) { var d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; }
function view(node) { if (!(node.querySelector && node.querySelector('#st'))) clearInterval(stTimer); app.innerHTML = ''; app.appendChild(node); window.scrollTo(0, 0); }
function $(id) { return document.getElementById(id); }

function msgView(icon, title, text, retry) {
  var c = html('<div class="card center narrow"><div class="big"></div><h2></h2><p class="h" style="font-size:15px"></p></div>');
  c.querySelector('.big').textContent = icon;
  c.querySelector('h2').textContent = title;
  c.querySelector('p').textContent = text;
  if (retry) {
    var b = html('<button class="btn alt" type="button">🔄 إعادة المحاولة</button>');
    b.addEventListener('click', retry);
    c.appendChild(b);
  }
  return c;
}
var stTimer = null;
function spinView(text) {
  clearInterval(stTimer);
  var c = html('<div class="card center narrow"><div class="spin"></div><p class="h" id="st" style="margin:10px 0 0;font-size:14px"></p></div>');
  var n = c.querySelector('#st'), t0 = Date.now();
  function tick() { n.textContent = (text || '') + (text ? ' (' + Math.floor((Date.now() - t0) / 1000) + ' ث)' : ''); }
  tick();
  if (text) stTimer = setInterval(function () { if (!document.getElementById('st')) { clearInterval(stTimer); return; } tick(); }, 1000);
  return c;
}

function cleanGid(v) {
  var s = String(v || '').trim()
    .replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
    .replace(/@g\.us$/i, '').replace(/\s+/g, '');
  return /^\d{8,}(-\d+)?$/.test(s) && s.length <= 40 ? s : '';
}

// ---------- طلب مراقبة جروب (مشترك بين قائمة الجروبات والإدخال اليدوي) ----------
// onBusy(busy): تغيير شكل الزر أثناء الانتظار. onFail(msg): فشل ولم تُستبدل الشاشة بعد.
function startWatch(gid, onBusy, onFail) {
  onBusy(true);
  return rpc({ a: 'watch', gid: gid }, 30000, true).then(function (j) {
    if (j.ok) {
      try { localStorage.setItem('cam_gid', gid); } catch (e) {}
      startLive(j);
      return true;
    }
    if (j.error === 'invalid') { view(msgView('⌛', 'الرابط غير صالح', j.message || '')); return true; }
    onBusy(false);
    onFail(j.message || '⚠️ حصل خطأ، حاول مرة أخرى');
    return false;
  }).catch(function () {
    onBusy(false);
    onFail('⚠️ ما وصلني رد من البوت، تأكد أنه شغّال وحاول مرة أخرى.');
    return false;
  });
}

// ---------- قائمة الجروبات (الشاشة الافتراضية بعد التحقق) ----------
function groupsView(groups, errText) {
  var c = html('<div class="card narrow">' +
    '<div class="lb">📋 جروبات البوت</div>' +
    '<p class="h">اضغط على جروب لبدء مراقبته مباشرة</p>' +
    '<div class="glist" id="gl"></div>' +
    '<div class="err" id="ger"></div>' +
    '<button class="btn alt sm" id="gre" type="button">🔄 تحديث القائمة</button>' +
    '<button class="btn alt sm" id="gma" type="button">⌨️ إدخال ايدي يدوياً</button></div>');
  var gl = c.querySelector('#gl'), ger = c.querySelector('#ger');
  ger.textContent = errText || '';

  if (!groups.length) {
    gl.appendChild(el('div', 'h', 'ما في أي جروب، تأكد أن البوت عضو في جروب على الأقل.'));
  }
  groups.forEach(function (g) {
    var item = html('<button class="gitem" type="button">' +
      '<span class="gnm"></span><span class="gcnt"></span></button>');
    item.querySelector('.gnm').textContent = g.name;
    item.querySelector('.gcnt').textContent = '👥 ' + g.count;
    item.addEventListener('click', function () {
      if (item.disabled) return;
      ger.textContent = '';
      startWatch(g.gid,
        function (b) { item.disabled = b; item.querySelector('.gnm').textContent = b ? '⏳ جاري الاتصال…' : g.name; },
        function (msg) { ger.textContent = msg; });
    });
    gl.appendChild(item);
  });

  c.querySelector('#gre').addEventListener('click', function () { loadGroups(); });
  c.querySelector('#gma').addEventListener('click', function () { view(formView()); });
  return c;
}

function loadGroups() {
  view(spinView());
  rpc({ a: 'groups' }, 25000, true).then(function (j) {
    if (j.ok) { view(groupsView(j.groups || [])); return; }
    view(formView(j.message || '⚠️ تعذّر جلب قائمة الجروبات، اكتب الايدي يدوياً.'));
  }).catch(function () {
    view(formView('⚠️ ما وصلني رد من البوت، اكتب الايدي يدوياً.'));
  });
}

// ---------- الإدخال اليدوي: ايدي الجروب ----------
function formView(errText) {
  var c = html('<div class="card narrow">' +
    '<div class="lb">🆔 ايدي الجروب</div>' +
    '<p class="h">اكتب ايدي الجروب الذي تريد مراقبته (أرقام فقط)</p>' +
    '<input id="gid" type="text" dir="ltr" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="120363xxxxxxxxxxxxxx">' +
    '<div class="s" id="gs"></div>' +
    '<button class="btn" id="go" type="button" disabled>👁️ مراقبة</button>' +
    '<button class="btn alt sm" id="gbk" type="button">📋 قائمة الجروبات</button>' +
    '<div class="err" id="er"></div></div>');
  var gid = c.querySelector('#gid'), gs = c.querySelector('#gs'), go = c.querySelector('#go'), er = c.querySelector('#er');
  var busy = false;
  er.textContent = errText || '';
  try { var last = localStorage.getItem('cam_gid'); if (last) gid.value = last; } catch (e) {}

  function upd() {
    var raw = gid.value.trim(), ok = !!cleanGid(raw);
    gid.className = raw ? (ok ? 'good' : 'bad') : '';
    gs.textContent = raw && !ok ? '⚠️ الايدي غير صالح، يجب أن يكون أرقاماً فقط' : '';
    go.disabled = busy || !ok;
  }
  gid.addEventListener('input', upd);
  gid.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !go.disabled) go.click(); });
  go.addEventListener('click', function () {
    if (busy) return;
    var g = cleanGid(gid.value);
    if (!g) return;
    er.textContent = '';
    startWatch(g,
      function (b) { busy = b; go.textContent = b ? '⏳ جاري الاتصال…' : '👁️ مراقبة'; upd(); },
      function (msg) { er.textContent = msg; });
  });
  c.querySelector('#gbk').addEventListener('click', function () { loadGroups(); });
  upd();
  return c;
}

// ---------- شاشة البث ----------
var watching = null;      // { gid, name, count, started, n, unread, ping, clock }

function two(n) { return (n < 10 ? '0' : '') + n; }
function clockStr(ms) {
  var s = Math.floor(ms / 1000);
  return two(Math.floor(s / 3600)) + ':' + two(Math.floor(s / 60) % 60) + ':' + two(s % 60);
}
function timeStr(ms) { try { return new Date(ms || Date.now()).toLocaleTimeString('en-GB'); } catch (e) { return ''; } }
function hue(s) { var h = 0, i; s = String(s); for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }

function liveView(info) {
  var canFs = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  var c = html('<div class="live" id="lv">' +
    '<div class="bar"><div class="l"><span class="rec"><i></i>LIVE</span><b class="gname" id="gn"></b></div><span class="cs" id="cs"></span></div>' +
    '<div class="stats"><span>👥 <b id="mc">0</b></span><span>💬 <b id="nc">0</b></span><span class="tc">⏱ <b id="tc">00:00:00</b></span></div>' +
    '<div class="screen"><div class="stage" id="stg"><div class="grid" id="grid"></div><div class="empty" id="se"><span class="ic">📡</span>متصل بالجروب<br>بانتظار نشاط الأعضاء…</div><div class="vig"></div><div class="chy" id="chy"></div></div>' +
    '<div class="feed" id="feed" style="display:none"><div class="empty" id="em">لا توجد رسائل بعد</div></div>' +
    '<button class="jump" id="jp" type="button">⬇️ للأحدث</button></div>' +
    '<div class="ctl">' + (canFs ? '<button class="btn alt sm" id="fs" type="button">⛶ كامل</button>' : '') +
    '<button class="btn alt sm" id="lg" type="button">📜 السجل</button>' +
    '<button class="btn alt sm" id="cl" type="button">🧹 مسح</button>' +
    '<button class="btn stop sm" id="sp" type="button">⏹️ إيقاف المراقبة</button></div></div>');
  c.querySelector('#gn').textContent = info.name || 'جروب';
  c.querySelector('#mc').textContent = String(info.count == null ? '—' : info.count);
  c.querySelector('#cs').textContent = connected ? '🟢 متصل' : '🟠 إعادة الاتصال…';

  var feed = c.querySelector('#feed'), jp = c.querySelector('#jp');
  feed.addEventListener('scroll', function () { if (nearBottom(feed)) { watching.unread = 0; jp.style.display = 'none'; } });
  jp.addEventListener('click', function () { feed.scrollTop = feed.scrollHeight; });
  c.querySelector('#cl').addEventListener('click', function () {
    feed.innerHTML = '';
    watching.unread = 0; jp.style.display = 'none';
  });
  c.querySelector('#lg').addEventListener('click', function () {
    var sg = c.querySelector('#stg'), on = feed.style.display === 'none';
    feed.style.display = on ? 'flex' : 'none'; sg.style.display = on ? 'none' : 'block';
    if (on) feed.scrollTop = feed.scrollHeight;
  });
  seats = {};
  c.querySelector('#sp').addEventListener('click', function () { endLive(true); view(formView()); });
  var fs = c.querySelector('#fs');
  if (fs) fs.addEventListener('click', function () {
    var lv = $('lv');
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (lv.requestFullscreen || lv.webkitRequestFullscreen).call(lv);
    }
  });
  return c;
}

function nearBottom(box) { return box.scrollHeight - box.scrollTop - box.clientHeight < 80; }

function startLive(info) {
  endLive(false);
  watching = { gid: info.gid, name: info.name, count: info.count, started: Date.now(), n: 0, unread: 0, ping: null, clock: null };
  view(liveView(info));
  document.title = '🔴 ' + (info.name || BASE_TITLE);
  watching.clock = setInterval(function () {
    var t = $('tc');
    if (t && watching) t.textContent = clockStr(Date.now() - watching.started);
  }, 1000);
  // نبضة كل ٤٥ ثانية: تُبقي المراقبة شغّالة وتُعيد تشغيلها لو البوت انقطع وعاد
  var gid = info.gid;
  watching.ping = setInterval(function () { send({ a: 'ping', gid: gid }, true).catch(function () {}); }, 45000);
}

function endLive(notify) {
  if (!watching) return;
  clearInterval(watching.ping);
  clearInterval(watching.clock);
  watching = null;
  seats = {};
  document.title = BASE_TITLE;
  if (notify) send({ a: 'stop' }, true).catch(function () {});
}

function row(x) {
  var name = String(x.s || '?');
  var r = el('div', 'm new' + (x.k === 'm' ? ' k-m' : '') + (x.k === 'd' ? ' k-d' : '') + (x.b ? ' bot' : ''));
  var h = hue(name + (x.n || ''));
  var ini = Array.from(name.replace(/[^\p{L}\p{N}]/gu, ''))[0] || '•';
  var av = el('div', 'av', x.b ? '🤖' : ini.toUpperCase());
  av.style.background = 'hsl(' + h + ',50%,36%)';
  var bd = el('div', 'bd');
  var hd = el('div', 'hd');
  var nm = el('span', 'nm', name);
  nm.style.color = 'hsl(' + h + ',75%,70%)';
  hd.appendChild(nm);
  if (x.n) hd.appendChild(el('span', 'nu', x.n));
  hd.appendChild(el('span', 'tm', timeStr(x.t)));
  bd.appendChild(hd);
  if (x.q) bd.appendChild(el('div', 'q', '↩️ ' + x.q));
  bd.appendChild(el('div', 'tx', String(x.x || '')));
  r.appendChild(av); r.appendChild(bd);
  setTimeout(function () { r.className = r.className.replace(' new', ''); }, 1200);
  return r;
}

var seats = {}, pics = {}, SEAT_MAX = 9;
function initOf(n) { return (Array.from(String(n).replace(/[^\p{L}\p{N}]/gu, ''))[0] || '•').toUpperCase(); }
function setPic(st, url) {
  if (!st || !/^https:\/\//.test(url || '')) return;
  var im = st.el.querySelector('img');
  im.referrerPolicy = 'no-referrer';
  im.onload = function () { im.style.display = 'block'; };
  im.onerror = function () { im.remove(); };
  im.src = url;
}
function seatOf(x) {
  var u = String(x.u || x.s || ''), g = $('grid');
  if (!u || !g) return null;
  var st = seats[u];
  if (!st) {
    var se = $('se'); if (se) se.remove();
    var ks = Object.keys(seats), i, old = null;
    if (ks.length >= SEAT_MAX) {
      for (i = 0; i < ks.length; i++) if (!old || seats[ks[i]].last < seats[old].last) old = ks[i];
      seats[old].el.remove(); delete seats[old];
    }
    var nm = x.s || ('عضو ' + u.slice(-4));
    var d = html('<div class="tile"><div class="stt"></div><div class="pic"><b></b><img alt=""></div><div class="cap"></div><div class="nmb"></div></div>');
    d.querySelector('.pic').style.background = 'hsl(' + hue(nm) + ',50%,34%)';
    d.querySelector('b').textContent = initOf(nm);
    d.querySelector('.nmb').textContent = nm;
    st = seats[u] = { el: d, last: Date.now(), named: !!x.s, ct: null, yt: null };
    g.appendChild(d);
    setPic(st, pics[u]);
  } else if (x.s && !st.named) {
    st.named = true;
    st.el.querySelector('.nmb').textContent = x.s;
    st.el.querySelector('b').textContent = initOf(x.s);
    st.el.querySelector('.pic').style.background = 'hsl(' + hue(x.s) + ',50%,34%)';
  }
  return st;
}
function stageEv(x) {
  if (!$('grid')) return;
  var now = Date.now(), u;
  for (u in seats) if (now - seats[u].last > 240000) { seats[u].el.remove(); delete seats[u]; }
  if (x.k === 'p') {
    if (x.u && /^https:\/\//.test(x.a || '')) { pics[x.u] = x.a; if (seats[x.u]) setPic(seats[x.u], x.a); }
    return;
  }
  var st = seatOf(x);
  if (!st) return;
  st.last = now;
  var e = st.el;
  if (x.k === 'y') {
    e.classList.remove('typ', 'rec'); e.classList.add(x.x === 'r' ? 'rec' : 'typ');
    clearTimeout(st.yt); st.yt = setTimeout(function () { e.classList.remove('typ', 'rec'); }, 8000);
    return;
  }
  clearTimeout(st.yt); e.classList.remove('typ', 'rec');
  var txt = x.k === 'd' ? '🗑️ حذف رسالة' : String(x.x || '');
  var cap = e.querySelector('.cap');
  cap.textContent = txt.length > 160 ? txt.slice(0, 159) + '…' : txt;
  cap.classList.add('on'); e.classList.add('spk');
  clearTimeout(st.ct);
  st.ct = setTimeout(function () { cap.classList.remove('on'); e.classList.remove('spk'); }, Math.min(12000, 3500 + txt.length * 45));
  var ch = $('chy');
  if (ch) {
    ch.textContent = '';
    ch.appendChild(el('b', '', (x.s || 'مجهول') + ': '));
    ch.appendChild(el('span', '', txt.length > 200 ? txt.slice(0, 199) + '…' : txt));
    ch.classList.remove('in'); void ch.offsetWidth; ch.classList.add('in');
  }
}

function addMsgs(list) {
  var feed = $('feed');
  if (!feed || !watching) return;
  var stick = nearBottom(feed);
  var em = $('em');
  if (em) em.remove();
  var k;
  for (k = 0; k < list.length; k++) {
    var it = list[k];
    if (it && typeof it === 'object') {
      stageEv(it);
      if (it.k !== 'p' && it.k !== 'y') { feed.appendChild(row(it)); watching.n++; }
    }
  }
  while (feed.children.length > 400) feed.removeChild(feed.firstChild);
  var nc = $('nc');
  if (nc) nc.textContent = String(watching.n);
  var jp = $('jp');
  if (stick) {
    feed.scrollTop = feed.scrollHeight;
  } else if (jp) {
    watching.unread += list.length;
    jp.textContent = '⬇️ ' + watching.unread + ' جديدة';
    jp.style.display = 'block';
  }
}

// ---------------------------------------------------------------
// البداية
// ---------------------------------------------------------------
// ---------------------------------------------------------------
// التحقق: لازم تكون من النخبة أو المطور
// 1) الصفحة تولّد مفتاحاً (ECDH) وكوداً من ٦ أرقام وتسجّلهما عند البوت
// 2) تكتب الكود في واتساب: .كاميرا 123456 ← البوت يقرأ رقمك الحقيقي ويتأكد أنك نخبة/مطور
// 3) نجح: نشتق مفتاح جلسة لا يعرفه غير هذا المتصفح ونفتح الشاشة | فشل: "هذا الأمر مخصص للنخبة"
// ---------------------------------------------------------------
var AUTH = { st: 'none', kp: null, pub: '', code: '', pre: '.', timer: null };

function genCode() { var a = new Uint32Array(1); crypto.getRandomValues(a); return String(100000 + (a[0] % 900000)); }

function deniedView() {
  return msgView('⛔', 'هذا الأمر مخصص للنخبة', 'رقمك ليس ضمن النخبة أو المطورين، لذلك لا تملك صلاحية استخدام هذه الصفحة.', startAuth);
}

function authView() {
  var cmd = AUTH.pre + 'كاميرا ' + AUTH.code;
  var c = html('<div class="card center narrow"><div class="big">🔒</div><h2>هذا الأمر مخصص للنخبة</h2>' +
    '<p class="h" style="font-size:15px">للتحقق من أنك من النخبة أو المطور، أرسل الأمر التالي في المحادثة مع البوت:</p>' +
    '<div class="codebox" id="cb"></div>' +
    '<button class="btn alt sm" id="cp" type="button">📋 نسخ الأمر</button>' +
    '<p class="h" style="margin-top:14px">⏳ بانتظار التحقق… تُفتح الصفحة تلقائياً بعد نجاحه</p><div class="spin"></div></div>');
  c.querySelector('#cb').textContent = cmd;
  var cp = c.querySelector('#cp');
  cp.addEventListener('click', function () {
    function done() { cp.textContent = '✅ تم النسخ'; setTimeout(function () { cp.textContent = '📋 نسخ الأمر'; }, 1800); }
    try { navigator.clipboard.writeText(cmd).then(done, function () {}); } catch (e) {}
  });
  return c;
}

// بعد نجاح التحقق: لو أنت أصلاً تراقب جروباً (صفحة أعيد فتحها) نرجعك لشاشة البث، وإلا نعرض قائمة الجروبات
function afterAuth() {
  view(spinView());
  rpc({ a: 'state' }, 25000, true).then(function (j) {
    if (j.ok && j.active) { startLive(j.active); return; }
    loadGroups();
  }).catch(function () { loadGroups(); });
}

async function startAuth() {
  clearTimeout(AUTH.timer);
  endLive(false);
  CFG.sk = null;
  AUTH.st = 'wait';
  view(spinView('📡 متصل بالوسيط، بانتظار رد البوت'));
  try {
    AUTH.kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
    AUTH.pub = b64(new Uint8Array(await crypto.subtle.exportKey('raw', AUTH.kp.publicKey)));
    var tries = 0, j, att = 0;
    AUTH.code = genCode();
    for (;;) {
      try {
        j = await rpc({ a: 'auth', c: AUTH.code, pk: AUTH.pub }, 12000, false);
      } catch (e) {
        if (++att < 3) continue;   // لا رد: نعيد الإرسال بنفس الكود (٣ محاولات)
        throw e;
      }
      if (j.ok) break;
      if (j.error === 'taken') AUTH.code = genCode();
      if (j.error === 'taken' && ++tries < 6) continue;
      if (j.error === 'invalid') { AUTH.st = 'none'; view(msgView('⌛', 'الرابط غير صالح', j.message || '')); return; }
      throw new Error(j.message || 'auth');
    }
    if (typeof j.p === 'string' && j.p && j.p.length <= 3) AUTH.pre = j.p;
    view(authView());
    AUTH.timer = setTimeout(function () { if (AUTH.st === 'wait') startAuth(); }, 9 * 60 * 1000);
  } catch (e) {
    AUTH.st = 'none';
    view(msgView('⚠️', 'البوت لا يرد حالياً', 'الصفحة اتصلت بالوسيط لكن البوت ما ردّ. افتح رسالة .كاميرا في واتساب وشوف سطر «الوسيط»: لو كان 🟡 يعني البوت غير متصل بـ ntfy.sh (راجع سجل katabump)، ولو 🟢 اطلب رابطاً جديداً بـ .كاميرا.', startAuth));
  }
}

async function onAuth(o) {
  if (AUTH.st !== 'wait' || !AUTH.kp || o.c !== AUTH.code) return;
  if (!o.ok) { AUTH.st = 'denied'; clearTimeout(AUTH.timer); view(deniedView()); return; }
  try {
    var bp = await crypto.subtle.importKey('raw', unb64(o.bp), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    var bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'ECDH', public: bp }, AUTH.kp.privateKey, 256));
    var pre = enc8.encode('obito-cam-s:' + CFG.tok);
    var all = new Uint8Array(pre.length + bits.length);
    all.set(pre, 0); all.set(bits, pre.length);
    CFG.sk = await crypto.subtle.importKey('raw', new Uint8Array(await crypto.subtle.digest('SHA-256', all)), 'AES-GCM', false, ['encrypt', 'decrypt']);
    AUTH.st = 'ok';
    clearTimeout(AUTH.timer);
    afterAuth();
  } catch (e) {
    AUTH.st = 'none';
    view(msgView('⚠️', 'فشل التحقق', 'حاول مرة أخرى.', startAuth));
  }
}

function startAll() {
  view(spinView('🔌 جاري الاتصال بالوسيط'));
  ready = false; stopped = false;
  connect();
  setTimeout(function () {
    if (!ready) view(msgView('⚠️', 'تعذّر الاتصال بالوسيط', 'الصفحة ما قدرت توصل لـ ntfy.sh. تأكد من الإنترنت، وأن VPN أو مانع الإعلانات لا يحجب الموقع، وجرّب مرة أخرى.', startAll));
  }, 15000);
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible' || !CFG || !ready) return;
  if (watching) send({ a: 'ping', gid: watching.gid }, true).catch(function () {});
  if (!es) connect();
});
// مراقب: لو انقطعت القناة بصمت أكثر من دقيقتين نعيد الاتصال
wdT = setInterval(function () {
  if (ready && es && Date.now() - lastBeat > 120000) connect();
}, 20000);

initCfg(location.hash).then(function (ok) {
  if (!ok) { view(msgView('🔗', 'رابط غير صالح', 'افتح الصفحة من الزر الذي يرسله البوت في المحادثة بعد أمر .كاميرا')); return; }
  startAll();
}).catch(function () {
  view(msgView('⚠️', 'متصفحك لا يدعم هذه الصفحة', 'جرّب فتح الرابط في كروم أو سفاري.'));
});
})();
